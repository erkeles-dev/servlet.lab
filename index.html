<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <title>Кіру формасы</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            text-align: center;
            margin-top: 100px;
        }

        .login-box {
            background: white;
            width: 300px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #cccccc;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            background: #007bff;
            color: white;
            padding: 10px 25px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Жүйеге кіру</h2>

    <form action="login" method="post">
        <input type="text" name="username"
               placeholder="Логин" required>

        <input type="password" name="password"
               placeholder="Пароль" required>

        <br><br>
        <button type="submit">Кіру</button>
    </form>
</div>

</body>
</html>
